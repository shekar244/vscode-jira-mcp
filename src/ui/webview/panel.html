<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jira MCP</title>
<style>
  :root {
    --bg:       var(--vscode-editor-background);
    --fg:       var(--vscode-editor-foreground);
    --surface:  var(--vscode-sideBar-background);
    --border:   var(--vscode-panel-border, #3a3a4a);
    --accent:   var(--vscode-focusBorder, #007acc);
    --input-bg: var(--vscode-input-background);
    --input-fg: var(--vscode-input-foreground);
    --btn-bg:   var(--vscode-button-background);
    --btn-fg:   var(--vscode-button-foreground);
    --btn-hov:  var(--vscode-button-hoverBackground);
    --tag-done: #2d6a3f;  --tag-done-fg: #8ecb8a;
    --tag-prog: #1a4a7a;  --tag-prog-fg: #7ea8ff;
    --tag-todo: #4a4a2a;  --tag-todo-fg: #f0d080;
    --tag-blk:  #6a1a1a;  --tag-blk-fg:  #f07090;
    font-family: var(--vscode-font-family, system-ui);
    font-size:   var(--vscode-font-size, 13px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

  /* ── Header ── */
  .header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    background: var(--surface);
  }
  .header h1 { font-size: 14px; font-weight: 700; flex-shrink: 0; }
  .search-bar { display: flex; gap: 6px; flex: 1; }
  .search-bar input {
    flex: 1; background: var(--input-bg); color: var(--input-fg);
    border: 1px solid var(--border); border-radius: 4px; padding: 5px 9px;
    font-size: 12px; font-family: monospace; outline: none;
  }
  .search-bar input:focus { border-color: var(--accent); }
  .btn {
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    background: var(--btn-bg); color: var(--btn-fg);
    border: none; border-radius: 4px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--btn-hov); }
  .btn-ghost {
    background: transparent; color: var(--fg);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); background: transparent; }

  /* ── Status bar ── */
  .statusbar {
    padding: 3px 14px; font-size: 11px; color: var(--vscode-statusBar-foreground, #aaa);
    background: var(--vscode-statusBar-background, #1a1a2e);
    border-top: 1px solid var(--border); display: flex; gap: 12px; flex-shrink: 0;
  }

  /* ── Main content ── */
  .main { display: flex; flex: 1; min-height: 0; }

  /* ── Issues pane ── */
  .issues-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .pane-toolbar {
    padding: 7px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    font-size: 11px; color: var(--vscode-descriptionForeground, #888);
  }
  .pane-toolbar .count { font-weight: 700; color: var(--fg); }
  .issue-list { flex: 1; overflow-y: auto; }
  .issue-row {
    display: grid;
    grid-template-columns: 88px 1fr 100px 100px 110px;
    align-items: center; gap: 8px;
    padding: 7px 12px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.1s;
  }
  .issue-row:hover { background: var(--vscode-list-hoverBackground, rgba(255,255,255,0.04)); }
  .issue-key { font-family: monospace; font-size: 11.5px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .issue-summary { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .issue-assignee { font-size: 11px; color: var(--vscode-descriptionForeground, #888); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .issue-updated  { font-size: 10.5px; color: var(--vscode-descriptionForeground, #888); white-space: nowrap; }

  .tag {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 20px; white-space: nowrap;
  }
  .tag-done { background: var(--tag-done); color: var(--tag-done-fg); }
  .tag-prog { background: var(--tag-prog); color: var(--tag-prog-fg); }
  .tag-todo { background: var(--tag-todo); color: var(--tag-todo-fg); }
  .tag-blk  { background: var(--tag-blk);  color: var(--tag-blk-fg);  }

  /* ── Summary pane ── */
  .summary-pane {
    width: 320px; flex-shrink: 0; border-left: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--surface);
  }
  .summary-pane.collapsed { width: 0; overflow: hidden; border: none; }
  .summary-header {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700;
  }
  .summary-body { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .summary-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px;
  }
  .summary-card-title { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--vscode-descriptionForeground, #888); margin-bottom: 8px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 12px; }
  .stat-val { font-weight: 700; font-family: monospace; font-size: 14px; }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 6px 0; }
  .progress-fill { height: 100%; background: var(--tag-done-fg); border-radius: 3px; transition: width 0.4s; }
  .blocker-item { font-size: 11px; padding: 3px 0; border-bottom: 1px solid var(--border); }
  .blocker-item:last-child { border: none; }
  .blocker-key { font-family: monospace; color: var(--tag-blk-fg); font-weight: 700; margin-right: 4px; }
  .copy-btn { margin-top: 8px; width: 100%; }

  /* ── Column headers ── */
  .list-header {
    display: grid; grid-template-columns: 88px 1fr 100px 100px 110px;
    gap: 8px; padding: 5px 12px; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.07em;
    color: var(--vscode-descriptionForeground, #888);
    border-bottom: 1px solid var(--border); background: var(--surface);
    position: sticky; top: 0; z-index: 2;
  }

  /* ── Empty / loading states ── */
  .center-msg {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 1; color: var(--vscode-descriptionForeground, #888); font-size: 12px; gap: 8px;
  }
  .spinner { width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ── Header ── -->
<div class="header">
  <h1>Jira MCP</h1>
  <div class="search-bar">
    <input type="text" id="jqlInput" placeholder='JQL: project = ABC ORDER BY updated DESC' />
    <button class="btn" onclick="search()">Search</button>
  </div>
  <button class="btn btn-ghost" onclick="summarize()" title="Compile status summary">Summarize</button>
  <button class="btn btn-ghost" onclick="toggleSummary()" id="toggleBtn" title="Toggle summary panel">◧</button>
</div>

<!-- ── Main ── -->
<div class="main">

  <!-- Issues pane -->
  <div class="issues-pane">
    <div class="pane-toolbar">
      <span id="jqlLabel" style="font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;"></span>
      <span class="count" id="issueCount">0 issues</span>
    </div>
    <div id="issueContainer" class="issue-list">
      <div class="center-msg" id="placeholder">
        <div class="spinner"></div>
        <span>Connecting to Jira MCP…</span>
      </div>
    </div>
  </div>

  <!-- Summary pane -->
  <div class="summary-pane" id="summaryPane">
    <div class="summary-header">
      📊 Status Summary
      <button class="btn btn-ghost" style="margin-left:auto;padding:2px 8px;font-size:10px;" onclick="copySummary()">Copy MD</button>
    </div>
    <div class="summary-body" id="summaryBody">
      <div class="center-msg" style="color:var(--vscode-descriptionForeground,#888);">
        Click <strong>Summarize</strong> to compile status
      </div>
    </div>
  </div>

</div>

<!-- ── Status bar ── -->
<div class="statusbar">
  <span id="connStatus">⬤ Connecting…</span>
  <span id="lastUpdated"></span>
</div>

<script>
const vscode = acquireVsCodeApi();
let currentIssues = [];
let currentMarkdown = '';
let summaryVisible = true;

// ── VS Code → Webview messages ─────────────────────────────────────────────
window.addEventListener('message', ({ data }) => {
  switch (data.type) {
    case 'loading':
      showLoading(data.message);
      break;
    case 'issues':
      renderIssues(data.issues, data.jql);
      break;
    case 'summary':
      renderSummary(data.summary);
      break;
    case 'error':
      showError(data.message);
      break;
  }
});

// ── Commands ───────────────────────────────────────────────────────────────
function search() {
  const jql = document.getElementById('jqlInput').value.trim();
  if (!jql) { return; }
  vscode.postMessage({ type: 'search', jql });
}

function summarize() {
  vscode.postMessage({ type: 'summarize' });
  if (!summaryVisible) { toggleSummary(); }
}

function toggleSummary() {
  summaryVisible = !summaryVisible;
  document.getElementById('summaryPane').classList.toggle('collapsed', !summaryVisible);
}

function copySummary() {
  if (currentMarkdown) {
    vscode.postMessage({ type: 'copyMarkdown', markdown: currentMarkdown });
  }
}

document.getElementById('jqlInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { search(); }
});

// ── Render issues ──────────────────────────────────────────────────────────
function renderIssues(issues, jql) {
  currentIssues = issues;
  document.getElementById('jqlLabel').textContent = jql;
  document.getElementById('issueCount').textContent = `${issues.length} issue${issues.length !== 1 ? 's' : ''}`;
  document.getElementById('lastUpdated').textContent = `Last refreshed: ${new Date().toLocaleTimeString()}`;
  document.getElementById('connStatus').textContent = '⬤ Connected';

  const container = document.getElementById('issueContainer');

  if (issues.length === 0) {
    container.innerHTML = '<div class="center-msg"><span>No issues found for this query</span></div>';
    return;
  }

  const header = `<div class="list-header">
    <span>Key</span><span>Summary</span><span>Status</span>
    <span>Assignee</span><span>Updated</span>
  </div>`;

  const rows = issues.map(issue => {
    const tagClass = statusTagClass(issue.statusCat);
    const updated  = formatDate(issue.updated);
    return `<div class="issue-row" onclick="openIssue('${escapeAttr(issue.url)}')">
      <span class="issue-key">${esc(issue.key)}</span>
      <span class="issue-summary" title="${escapeAttr(issue.summary)}">${esc(issue.summary)}</span>
      <span><span class="tag ${tagClass}">${esc(issue.status)}</span></span>
      <span class="issue-assignee" title="${escapeAttr(issue.assignee)}">${esc(issue.assignee)}</span>
      <span class="issue-updated">${updated}</span>
    </div>`;
  }).join('');

  container.innerHTML = header + rows;
}

function openIssue(url) {
  if (url && url !== 'undefined') {
    vscode.postMessage({ type: 'openIssue', url });
  }
}

// ── Render summary ─────────────────────────────────────────────────────────
function renderSummary(summary) {
  currentMarkdown = summary.markdown;
  const body = document.getElementById('summaryBody');

  // Completion card
  let html = `<div class="summary-card">
    <div class="summary-card-title">Completion</div>
    <div class="stat-row"><span>Total Issues</span><span class="stat-val">${summary.total}</span></div>
    <div class="stat-row"><span>Done</span><span class="stat-val" style="color:var(--tag-done-fg)">${summary.byStatus.find(s=>s.label==='Done')?.count??0}</span></div>
    <div class="stat-row"><span>In Progress</span><span class="stat-val" style="color:var(--tag-prog-fg)">${summary.byStatus.find(s=>s.label==='In Progress')?.count??0}</span></div>
    <div class="stat-row"><span>To Do</span><span class="stat-val" style="color:var(--tag-todo-fg)">${summary.byStatus.find(s=>s.label==='To Do')?.count??0}</span></div>
    <div class="progress-bar"><div class="progress-fill" style="width:${summary.completion}%"></div></div>
    <div style="font-size:11px;text-align:right;color:var(--tag-done-fg);font-weight:700;">${summary.completion}% complete</div>
  </div>`;

  // Story points
  if (summary.storyPoints.total > 0) {
    html += `<div class="summary-card">
      <div class="summary-card-title">Story Points</div>
      <div class="stat-row"><span>Total</span><span class="stat-val">${summary.storyPoints.total}</span></div>
      <div class="stat-row"><span>Done</span><span class="stat-val" style="color:var(--tag-done-fg)">${summary.storyPoints.done}</span></div>
      <div class="stat-row"><span>In Progress</span><span class="stat-val" style="color:var(--tag-prog-fg)">${summary.storyPoints.inProgress}</span></div>
    </div>`;
  }

  // By assignee
  if (summary.byAssignee.length > 0) {
    const rows = summary.byAssignee.slice(0, 8).map(a =>
      `<div class="stat-row" style="font-size:11px;">
        <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px;">${esc(a.name)}</span>
        <span style="font-family:monospace;white-space:nowrap;">${a.done}✓ ${a.inProgress}▶ / ${a.total}</span>
      </div>`
    ).join('');
    html += `<div class="summary-card"><div class="summary-card-title">By Assignee</div>${rows}</div>`;
  }

  // Blockers
  if (summary.blockers.length > 0) {
    const items = summary.blockers.map(b =>
      `<div class="blocker-item"><span class="blocker-key">${esc(b.key)}</span>${esc(b.summary)}</div>`
    ).join('');
    html += `<div class="summary-card" style="border-color:var(--tag-blk-fg)">
      <div class="summary-card-title" style="color:var(--tag-blk-fg)">🚨 Blockers (${summary.blockers.length})</div>
      ${items}
    </div>`;
  }

  body.innerHTML = html;
}

// ── UI helpers ─────────────────────────────────────────────────────────────
function showLoading(msg) {
  document.getElementById('issueContainer').innerHTML =
    `<div class="center-msg"><div class="spinner"></div><span>${esc(msg)}</span></div>`;
}

function showError(msg) {
  document.getElementById('issueContainer').innerHTML =
    `<div class="center-msg" style="color:var(--tag-blk-fg)"><span>⚠ ${esc(msg)}</span></div>`;
  document.getElementById('connStatus').textContent = '⬤ Error';
}

function statusTagClass(cat) {
  if (cat === 'Done')        { return 'tag-done'; }
  if (cat === 'In Progress') { return 'tag-prog'; }
  if (cat === 'To Do')       { return 'tag-todo'; }
  return 'tag-todo';
}

function formatDate(iso) {
  if (!iso) { return '—'; }
  try {
    const d = new Date(iso);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000)      { return 'just now'; }
    if (diff < 3600000)    { return `${Math.floor(diff/60000)}m ago`; }
    if (diff < 86400000)   { return `${Math.floor(diff/3600000)}h ago`; }
    if (diff < 604800000)  { return `${Math.floor(diff/86400000)}d ago`; }
    return d.toLocaleDateString();
  } catch { return iso.slice(0,10); }
}

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function escapeAttr(s) {
  return String(s ?? '').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Signal ready to extension host
vscode.postMessage({ type: 'ready' });
</script>
</body>
</html>
